<svg xmlns="http://www.w3.org/2000/svg" width="860" height="168" viewBox="0 0 860 168" role="img" aria-label="LotusMCP — An MCP server that lets an LLM work a CTF from a Kali box.">
  <defs>
    <linearGradient id="shim0" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#d8d5ce" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d8d5ce" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#d8d5ce" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cclip0"><rect x="1" y="1" width="858" height="166" rx="10"/></clipPath>
  </defs>

  <rect x="1" y="1" width="858" height="166" rx="10" fill="#0b0b0c" stroke="#26262a" stroke-width="1.5"/>
  <rect x="2" y="2" width="5" height="164" fill="#d8d5ce" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0.4;0.85" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- watermark icon -->
  <g opacity="0.10" transform="translate(705,30) scale(4.5)" fill="none" stroke="#d8d5ce" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22V4a1 1 0 0 1 .4-.8A6 6 0 0 1 8 2c3 0 5 2 7.333 2q2 0 3.067-.8A1 1 0 0 1 20 4v10a1 1 0 0 1-.4.8A6 6 0 0 1 16 16c-3 0-5-2-8-2a6 6 0 0 0-4 1.528" /></g>

  <!-- index -->
  <text x="34" y="86" font-size="46" font-weight="700" fill="#d8d5ce" fill-opacity="0.16" font-family="'KK Mono','JetBrains Mono','SFMono-Regular',ui-monospace,Consolas,'Liberation Mono',Menlo,monospace">01</text>

  <!-- title + repo -->
  <text x="92" y="48" font-size="22" font-weight="700" fill="#d8d5ce" font-family="'KK Mono','JetBrains Mono','SFMono-Regular',ui-monospace,Consolas,'Liberation Mono',Menlo,monospace">LotusMCP</text>
  <text x="92" y="70" font-size="12" fill="#55534e" font-family="'KK Mono','JetBrains Mono','SFMono-Regular',ui-monospace,Consolas,'Liberation Mono',Menlo,monospace">› github.com/KuantumKnight/lotusMCP</text>

  <!-- brief -->
  <text x="92" y="96" font-size="13" fill="#d8d5ce" font-family="'KK Mono','JetBrains Mono','SFMono-Regular',ui-monospace,Consolas,'Liberation Mono',Menlo,monospace">An MCP server that lets an LLM work a CTF from a Kali box.</text>

  <!-- chips -->
  <rect x="92" y="128" width="62" height="20" rx="4" fill="#d8d5ce" fill-opacity="0.08" stroke="#d8d5ce" stroke-opacity="0.5"/><text x="123" y="142" text-anchor="middle" font-size="11" fill="#d8d5ce" font-family="'KK Mono','JetBrains Mono','SFMono-Regular',ui-monospace,Consolas,'Liberation Mono',Menlo,monospace">python</text><rect x="162.4" y="128" width="40" height="20" rx="4" fill="#d8d5ce" fill-opacity="0.08" stroke="#d8d5ce" stroke-opacity="0.5"/><text x="182" y="142" text-anchor="middle" font-size="11" fill="#d8d5ce" font-family="'KK Mono','JetBrains Mono','SFMono-Regular',ui-monospace,Consolas,'Liberation Mono',Menlo,monospace">mcp</text><rect x="210.60000000000002" y="128" width="62" height="20" rx="4" fill="#d8d5ce" fill-opacity="0.08" stroke="#d8d5ce" stroke-opacity="0.5"/><text x="242" y="142" text-anchor="middle" font-size="11" fill="#d8d5ce" font-family="'KK Mono','JetBrains Mono','SFMono-Regular',ui-monospace,Consolas,'Liberation Mono',Menlo,monospace">sqlite</text><rect x="281.0" y="128" width="48" height="20" rx="4" fill="#d8d5ce" fill-opacity="0.08" stroke="#d8d5ce" stroke-opacity="0.5"/><text x="305" y="142" text-anchor="middle" font-size="11" fill="#d8d5ce" font-family="'KK Mono','JetBrains Mono','SFMono-Regular',ui-monospace,Consolas,'Liberation Mono',Menlo,monospace">kali</text>

  <!-- hud brackets + scan shimmer -->
  <path d="M14,16 L14,8 L26,8" fill="none" stroke="#d8d5ce" stroke-opacity="0.5"/>
  <path d="M846,152 L846,160 L834,160" fill="none" stroke="#d8d5ce" stroke-opacity="0.5"/>
  <g clip-path="url(#cclip0)">
    <rect x="-200" y="1" width="200" height="166" fill="url(#shim0)">
      <animate attributeName="x" values="-200;860;860" keyTimes="0;0.6;1" dur="6s" begin="0.0s" repeatCount="indefinite"/>
    </rect>
  </g>
